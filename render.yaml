databases:
  - name: smarthouse-db
    databaseName: smarthouse_studio
    user: smarthouse_user
    plan: free

services:
  - type: web
    name: smarthouse-studio
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/time
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: smarthouse-db
          property: connectionString
